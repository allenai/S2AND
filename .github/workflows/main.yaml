name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
          key: uv-cache-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Run shared lint policy
        run: uv run --no-project python scripts/run_ci_locally.py lint

  typecheck-and-test:
    name: typecheck-and-test (${{ matrix.os }}, py${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        py: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            py: "3.11"
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # Required: uv uses this interpreter, so each matrix leg tests its own Python.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            s2and_rust/target
          # Hash only native build inputs; walking s2and_rust/target after a build exceeded the 120 s hashFiles limit on Windows.
          key: cargo-${{ runner.os }}-py${{ matrix.py }}-${{ hashFiles('s2and_rust/Cargo.toml', 's2and_rust/Cargo.lock', 's2and_rust/build.rs', 's2and_rust/src/**', 's2and_rust/vendor/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-py${{ matrix.py }}-

      - name: Cache uv + venv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-py${{ matrix.py }}-${{ hashFiles('pyproject.toml', 'uv.lock', 's2and_rust/Cargo.toml', 's2and_rust/Cargo.lock', 's2and_rust/build.rs', 's2and_rust/src/**', 's2and_rust/vendor/**') }}

      - name: Run shared typecheck-and-test policy
        run: uv run --no-project python scripts/run_ci_locally.py typecheck-and-test
