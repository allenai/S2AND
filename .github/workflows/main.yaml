name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Install uv (fast Python + package manager) and enable caching
      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # Cache uv tool + resolver cache
      - name: Cache uv caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
          key: uv-cache-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Run shared lint policy
        run: uv run --no-project python scripts/run_ci_locally.py lint

  typecheck-and-test:
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      S2AND_TEST_REQUIRE_RUST: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # Optional: ensure a specific Python (uv can also manage this on its own)
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            s2and_rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('s2and_rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Cache uv resolver + wheels + project venv
      - name: Cache uv + venv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-venv-${{ runner.os }}-py311-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-py311-
            uv-venv-

      - name: Run shared typecheck-and-test policy
        run: uv run --no-project python scripts/run_ci_locally.py typecheck-and-test
