name: release artifacts (build, test, publish)

on:
  workflow_dispatch:

jobs:
  validate:
    name: validate exact commit
    runs-on: ubuntu-latest
    steps:
      - name: Require main release ref
        run: test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Version sync check
        run: uv run --no-project python scripts/sync_version.py --check

      - name: Install exact source environment
        run: uv sync --frozen --extra dev

      - name: Run release test suite
        run: uv run pytest -q

  source-distributions:
    name: source distributions
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build s2and distributions
        run: uv build --sdist --wheel --out-dir dist --clear

      - name: Verify built release asset contract
        run: >-
          uv run --no-project python
          scripts/verification/verify_production_model_distributions.py
          --dist-dir dist --source-root .

      - name: Build s2and-rust sdist
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist
          working-directory: s2and_rust

      # Building from sdist compiles the extension, which is a distinct path from
      # installing a wheel. Exercise it on every supported interpreter.
      - name: Install and exercise s2and-rust sdist
        shell: bash
        run: |
          sdist="$(find s2and_rust/dist -type f -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          for py in 3.11 3.12 3.13; do
            echo "::group::s2and-rust sdist smoke (py${py})"
            smoke_venv="$RUNNER_TEMP/s2and-rust-sdist-smoke-${py}"
            uv venv --python "$py" "$smoke_venv"
            uv pip install --python "$smoke_venv/bin/python" "$sdist"
            uv run --no-project --python "$smoke_venv/bin/python" python \
              scripts/verification/smoke_installed_rust_api.py
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and
          path: dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-sdist
          path: s2and_rust/dist/*

  wheels-windows:
    name: wheels (windows, py${{ matrix.py }})
    runs-on: windows-latest
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          command: build
          args: --release --locked --compatibility pypi --out dist
          working-directory: s2and_rust

      - name: Install and exercise Windows wheel
        shell: pwsh
        run: |
          $smokeVenv = Join-Path $env:RUNNER_TEMP "s2and-rust-wheel-smoke"
          $wheel = (Get-ChildItem s2and_rust/dist/*.whl | Select-Object -First 1).FullName
          uv venv --python "${{ matrix.py }}" $smokeVenv
          $python = Join-Path $smokeVenv "Scripts/python.exe"
          uv pip install --python $python $wheel
          uv run --no-project --python $python python scripts/verification/smoke_installed_rust_api.py

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-windows-py${{ matrix.py }}
          path: s2and_rust/dist/*

  wheels-macos:
    name: wheels (macos universal2, py${{ matrix.py }})
    runs-on: macos-latest
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Rust targets (universal2)
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build wheels (universal2)
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        env:
          ARCHFLAGS: "-arch x86_64 -arch arm64"
        with:
          maturin-version: v1.14.1
          command: build
          args: --release --locked --compatibility pypi --out dist
          working-directory: s2and_rust

      - name: Install and exercise macOS wheel
        shell: bash
        run: |
          smoke_venv="$RUNNER_TEMP/s2and-rust-wheel-smoke"
          wheel="$(find s2and_rust/dist -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python "${{ matrix.py }}" "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" "$wheel"
          uv run --no-project --python "$smoke_venv/bin/python" python \
            scripts/verification/smoke_installed_rust_api.py

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-macos-universal2-py${{ matrix.py }}
          path: s2and_rust/dist/*

  wheels-linux:
    name: wheels (linux ${{ matrix.platform.name }})
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: manylinux2014-x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
          - name: manylinux2014-aarch64
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
          - name: musllinux-x86_64
            target: x86_64-unknown-linux-musl
            manylinux: "musllinux_1_2"

    steps:
      - uses: actions/checkout@v5

      - name: Build wheels (manylinux/musllinux)
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: >
            --release --locked --compatibility pypi --out dist
            -i python3.11 -i python3.12 -i python3.13
          working-directory: s2and_rust

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-linux-${{ matrix.platform.name }}
          path: s2and_rust/dist/*

  release-smoke:
    name: clean installed-artifact smoke (py${{ matrix.py }})
    needs: [source-distributions, wheels-windows, wheels-macos, wheels-linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Download s2and distributions
        uses: actions/download-artifact@v7
        with:
          name: dist-s2and
          path: release/s2and

      - name: Download s2and-rust distributions
        uses: actions/download-artifact@v7
        with:
          pattern: dist-s2and-rust-*
          merge-multiple: true
          path: release/s2and-rust

      - name: Clean-install release artifacts
        run: |
          SMOKE_VENV="$RUNNER_TEMP/s2and-release-smoke"
          PY_TAG="cp$(echo '${{ matrix.py }}' | tr -d .)"
          RUST_WHEEL="$(find release/s2and-rust -type f -name "*${PY_TAG}*manylinux*x86_64.whl" -print -quit)"
          PY_WHEEL="$(find release/s2and -type f -name 's2and-*.whl' -print -quit)"
          test -n "$RUST_WHEEL"
          test -n "$PY_WHEEL"
          uv venv --python '${{ matrix.py }}' "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" "$RUST_WHEEL" "$PY_WHEEL"

      - name: Exercise installed synthetic bulk and incremental Arrow paths
        run: |
          SMOKE_VENV="$RUNNER_TEMP/s2and-release-smoke"
          cd "$RUNNER_TEMP"
          uv run --no-project --python "$SMOKE_VENV/bin/python" python \
            "$GITHUB_WORKSPACE/scripts/verification/smoke_installed_incremental_arrow.py"

      # All matrix legs download identical artifacts; publish the tested set once
      # so the artifact name stays unique. `needs: [release-smoke]` still waits
      # for every leg, so publication requires all three versions to pass.
      - uses: actions/upload-artifact@v6
        if: matrix.py == '3.11'
        with:
          name: release-distributions
          path: release

  publish-rust:
    name: publish s2and-rust to PyPI
    needs: [release-smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download tested release artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-distributions
          path: release

      - name: Publish s2and-rust
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/s2and-rust

  publish-s2and:
    name: publish s2and to PyPI
    needs: [publish-rust]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Download tested release artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-distributions
          path: release

      - name: Wait for exact Rust dependency
        run: |
          RUST_VERSION="$(uv run --no-project python - <<'PY'
          import tomllib
          from pathlib import Path

          payload = tomllib.loads(Path('s2and_rust/pyproject.toml').read_text(encoding='utf-8'))
          print(payload['project']['version'])
          PY
          )"
          for attempt in $(seq 1 10); do
            echo "Rust install probe attempt $attempt/10 for s2and-rust==$RUST_VERSION"
            if uv run --no-project --isolated --with "s2and-rust==$RUST_VERSION" python -c "import s2and_rust"; then
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then
              sleep 15
            fi
          done
          echo "s2and-rust==$RUST_VERSION was not installable after 10 attempts" >&2
          exit 1

      - name: Publish s2and
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/s2and
