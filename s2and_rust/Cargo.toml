[package]
name = "s2and_rust"
version = "1.0.0-beta.4"
edition = "2021"
license = "MIT"

[lib]
name = "_s2and_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
# Fast hashing for per-row reader maps; already in the lockfile through arrow.
ahash = "0.8"
pyo3 = { version = "0.24.2" }
numpy = "0.24"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
cld2 = { version = "1.0.2", path = "vendor/cld2" }
serde_json = "1.0"
sha2 = "0.10"
arrow = { version = "54", default-features = false, features = ["ipc"] }
unidecode = "0.3.0"
memmap2 = "0.9"
unicode-properties = "0.1"

# Worker threads that allocate in parallel contend for glibc malloc arenas.
# Musl wheels keep the system allocator, because CI never imports them.
# Linux aarch64 wheels keep it too: the manylinux2014 cross GCC cannot build mimalloc.
# Keep this cfg equal to the global allocator's cfg in src/lib.rs.
[target.'cfg(not(any(target_env = "musl", all(target_os = "linux", target_arch = "aarch64"))))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[build-dependencies]
sha2 = "0.10"
