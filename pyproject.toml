[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "s2and"
version = "1.0.0b5"
description = "S2AND"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Code is MIT (LICENSE); packaged data files are CC-BY-4.0 (LICENSE-DATA).
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-DATA", "s2and_rust/THIRD_PARTY_NOTICES.md", "s2and_rust/vendor/cld2/LICENSE-APACHE.txt", "s2and_rust/vendor/cld2/UNLICENSE.txt"]
authors = [{ name = "Sergey Feldman, Daniel King, Shivashankar Subramanian" }]

# --- Runtime dependencies ---
dependencies = [
  "setuptools>=78.1.1,<82",
  # Matplotlib accepts older Pillow releases, so keep an explicit security floor.
  "pillow>=12.3,<13",
  "pycld2>=0.41",
  "scikit-learn==1.9.0",
  "text-unidecode==1.3",
  "hyperopt==0.3.0",
  "pandas>=2.2.2,<3",
  "lightgbm==4.7.0",
  "fastcluster>=1.3,<2",
  # Keep the faster 1.1.6 implementation where its common-platform wheels
  # exist; use 1.2 on architectures for which 1.1.6 only ships an sdist.
  "genieclust>=1.1.6,<1.2; platform_system == 'Darwin' or (platform_system == 'Windows' and platform_machine == 'AMD64') or (platform_system == 'Linux' and platform_machine == 'x86_64')",
  "genieclust>=1.2,<1.3; platform_system != 'Darwin' and (platform_system != 'Windows' or platform_machine != 'AMD64') and (platform_system != 'Linux' or platform_machine != 'x86_64')",
  # quitefastmst 0.9.1 changed mst_euclid's return shape incompatibly with
  # genieclust 1.2.0; constrain only the fallback environments that install it.
  "quitefastmst==0.9.0; platform_system != 'Darwin' and (platform_system != 'Windows' or platform_machine != 'AMD64') and (platform_system != 'Linux' or platform_machine != 'x86_64')",
  "matplotlib>=3.11.1,<4",
  "seaborn>=0.12,<0.14",
  "tqdm>=4.69,<5",
  "strsimpy>=0.2,<0.3",
  "jellyfish>=1.2.1,<2",
  "numpy>=2,<2.3",
  "shap>=0.51,<1",
  # PyArrow 21+ no longer publishes manylinux2014 wheels; our release target is glibc 2.17.
  "pyarrow>=20,<21",
  # Memory budgets read total RAM and process RSS from psutil.
  "psutil>=7,<8",
]

[project.optional-dependencies]
author-counts = [
  "boto3>=1.40,<2",
  "duckdb>=1.5,<2",
]
orcid-counts = [
  "orjson>=3.11.9,<4",
]
dev = [
  # Test stack
  "pytest==9.1.1",
  "pytest-cov>=7.1,<8",
  "pytest-xdist>=3.8,<4",
  "pyyaml>=6.0.3,<7",
  # Type checking
  "ty==0.0.61",
  # Linters/formatters
  "ruff==0.15.22",
  # Local Rust extension build tooling
  "maturin>=1.14.1",
  # Test the optional ORCID count producer without making orjson a core dependency.
  "orjson>=3.11.9,<4",
  # Run the release data-preparation and Parquet count-producer tests instead of skipping them.
  "ijson>=3.3,<4",
  "duckdb>=1.5,<2",
  "boto3>=1.40,<2",
]

[tool.maturin]
manifest-path = "s2and_rust/Cargo.toml"
bindings = "pyo3"
python-source = "."
module-name = "s2and._s2and_rust"
include = [
  { path = "VERSION", format = "sdist" },
  { path = "tests/fixtures/canonical_name_examples.json", format = "sdist" },
  { path = "s2and/arrow_schema_contract.json", format = ["sdist", "wheel"] },
  { path = "s2and/data/first_k_letter_counts_from_orcid.json", format = ["sdist", "wheel"] },
  { path = "s2and/data/first_k_letter_counts_from_orcid.manifest.json", format = ["sdist", "wheel"] },
  { path = "s2and/data/path_config.json", format = ["sdist", "wheel"] },
  { path = "s2and/data/s2and_name_tuples_canonical.txt", format = ["sdist", "wheel"] },
  { path = "s2and_rust/vendor/cld2/**/*", format = "sdist" },
]
exclude = ["s2and/data/s2and_name_tuples_filtered.txt", "s2and/data/s2and_unnormalized_filtered_name_tuples.txt"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "s2and_rust/Cargo.toml" },
  { file = "s2and_rust/Cargo.lock" },
  { file = "s2and_rust/build.rs" },
  { file = "s2and_rust/src/**/*.rs" },
  { file = "s2and_rust/vendor/cld2/Cargo.toml" },
  { file = "s2and_rust/vendor/cld2/src/**/*.rs" },
]

# ---- Tooling config ----

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-ra"]

[tool.coverage.run]
# pytest-cov 7 delegates subprocess measurement to coverage.py.
patch = ["subprocess"]
branch = true

[tool.coverage.report]
# The bounded suite measures about 85% combined line/branch coverage on Windows.
# Leave platform headroom while rejecting substantial coverage loss in CI.
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","UP","B"]
ignore = []

# ty defaults match the GitHub Linux CI runners; CLI flags still override them.
[tool.ty.environment]
python-version = "3.11"
python-platform = "linux"

# Optional and native modules can be absent from static-only environments.
[tool.ty.rules]
unresolved-import = "ignore"
unused-type-ignore-comment = "ignore"
possibly-missing-attribute = "ignore"
unresolved-global = "ignore"
