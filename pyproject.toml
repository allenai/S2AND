[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "s2and"
dynamic = ["version"]
description = "S2AND"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "Sergey Feldman, Daniel King, Shivashankar Subramanian" }]

# --- Runtime dependencies ---
dependencies = [
  "setuptools>=78.1.1,<82",
  # Matplotlib accepts older Pillow releases, so keep an explicit security floor.
  "pillow>=12.3,<13",
  "pycld2>=0.41",
  "scikit-learn==1.9.0",
  "text-unidecode==1.3",
  "hyperopt==0.2.7",
  "pandas>=2.2.2,<3",
  "lightgbm==4.7.0",
  "fastcluster>=1.3,<2",
  # Keep the faster 1.1.6 implementation where its common-platform wheels
  # exist; use 1.2 on architectures for which 1.1.6 only ships an sdist.
  "genieclust>=1.1.6,<1.2; platform_system == 'Darwin' or (platform_system == 'Windows' and platform_machine == 'AMD64') or (platform_system == 'Linux' and platform_machine == 'x86_64')",
  "genieclust>=1.2,<1.3; platform_system != 'Darwin' and (platform_system != 'Windows' or platform_machine != 'AMD64') and (platform_system != 'Linux' or platform_machine != 'x86_64')",
  # quitefastmst 0.9.1 changed mst_euclid's return shape incompatibly with
  # genieclust 1.2.0; constrain only the fallback environments that install it.
  "quitefastmst==0.9.0; platform_system != 'Darwin' and (platform_system != 'Windows' or platform_machine != 'AMD64') and (platform_system != 'Linux' or platform_machine != 'x86_64')",
  "matplotlib>=3.11.1,<4",
  "seaborn>=0.12,<0.14",
  "tqdm>=4.69,<5",
  "strsimpy>=0.2,<0.3",
  "jellyfish>=1.2.1,<2",
  "numpy>=2,<2.3",
  "shap>=0.51,<1",
  # PyArrow 21+ no longer publishes manylinux2014 wheels; our release target is glibc 2.17.
  "pyarrow>=20,<21",
  "s2and-rust==0.60.0",
]

[project.optional-dependencies]
orcid-counts = [
  "orjson>=3.11.9,<4",
]
dev = [
  # Test stack
  "pytest==9.1.1",
  "pytest-cov>=7.1,<8",
  "pyyaml>=6.0.3,<7",
  # Type checking
  "ty==0.0.61",
  # Linters/formatters
  "ruff==0.15.22",
  # Local Rust extension build tooling
  "maturin>=1.14.1",
  # Test the optional ORCID count producer without making orjson a core dependency.
  "orjson>=3.11.9,<4",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["s2and*"]
exclude = ["s2and_rust*"]

[tool.setuptools.package-data]
s2and = [
  "arrow_schema_contract.json",
  "data/path_config.json",
  "data/first_k_letter_counts_from_orcid.json",
  "data/first_k_letter_counts_from_orcid.manifest.json",
  "data/s2and_name_tuples_canonical.txt",
  "data/s2and_name_tuples_canonical.txt.meta.json",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

# ---- Tooling config ----

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "requires_lfs: tests that require Git LFS artifacts to be materialized",
]

[tool.coverage.run]
# pytest-cov 7 delegates subprocess measurement to coverage.py.
patch = ["subprocess"]

# Ruff config (used for lint + format)
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","UP","B"]
ignore = []

[tool.uv.sources]
s2and-rust = { path = "s2and_rust" }
