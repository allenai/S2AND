name: release artifacts (build, test, publish)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build jobs (manual/PR testing)"
        required: false
        type: boolean
      publish_s2and:
        description: "Publish s2and to PyPI (manual run)"
        required: false
        type: boolean
      publish_rust:
        description: "Publish s2and-rust to PyPI (manual run)"
        required: false
        type: boolean

jobs:
  detect-versions:
    name: detect version changes
    runs-on: ubuntu-latest
    outputs:
      s2and_changed: ${{ steps.detect.outputs.s2and_changed }}
      rust_changed: ${{ steps.detect.outputs.rust_changed }}
      publish_any: ${{ steps.detect.outputs.publish_any }}
      publish_s2and: ${{ steps.detect.outputs.publish_s2and }}
      publish_rust: ${{ steps.detect.outputs.publish_rust }}
      force_build: ${{ steps.detect.outputs.force_build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Version sync check
        run: uv run --no-project python scripts/sync_version.py --check

      - name: Detect version changes
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          uv run --no-project python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tomllib

          event_name = os.environ.get("GITHUB_EVENT_NAME") or ""
          event_path = os.environ.get("GITHUB_EVENT_PATH") or ""
          event = None
          if event_path and os.path.exists(event_path):
            with open(event_path, "r", encoding="utf-8") as f:
              event = json.load(f)

          force_build = False
          publish_s2and = False
          publish_rust = False
          if event_name == "workflow_dispatch":
            inputs = (event or {}).get("inputs", {})
            force_build = str(inputs.get("force_build", "")).lower() in {"1", "true", "yes", "on"}
            publish_s2and = str(inputs.get("publish_s2and", "")).lower() in {"1", "true", "yes", "on"}
            publish_rust = str(inputs.get("publish_rust", "")).lower() in {"1", "true", "yes", "on"}
          elif event_name == "pull_request":
            labels = (event or {}).get("pull_request", {}).get("labels", [])
            force_build = any((label or {}).get("name", "").lower() == "force-build" for label in labels)

          before = os.environ.get("BEFORE_SHA") or ""
          if event_name == "pull_request" and event:
            before = (event.get("pull_request", {}).get("base", {}).get("sha", "")) or ""
          if before.startswith("0000000"):
            before = ""

          def read_toml_at(path, rev=None):
            if rev:
              try:
                data = subprocess.check_output(["git", "show", f"{rev}:{path}"], text=True)
              except subprocess.CalledProcessError:
                return None
              return tomllib.loads(data)
            with open(path, "rb") as f:
              return tomllib.load(f)

          def read_version_file(rev=None):
            version_path = "VERSION"
            if rev:
              try:
                data = subprocess.check_output(["git", "show", f"{rev}:{version_path}"], text=True)
              except subprocess.CalledProcessError:
                return None
              return data.strip()
            if not os.path.exists(version_path):
              return None
            with open(version_path, "r", encoding="utf-8") as f:
              return f.read().strip()

          def get_project_version(toml_obj, path, rev=None):
            if toml_obj is None:
              return None
            try:
              return toml_obj["project"]["version"]
            except KeyError:
              # Allow dynamic version from VERSION for the root pyproject.toml.
              if path == "pyproject.toml":
                version = read_version_file(rev)
                if version:
                  return version
              raise SystemExit(f"Missing [project].version in {path}")

          def get_cargo_version(toml_obj, path):
            if toml_obj is None:
              return None
            try:
              return toml_obj["package"]["version"]
            except KeyError:
              raise SystemExit(f"Missing [package].version in {path}")

          cur_py = read_toml_at("pyproject.toml")
          cur_rust_py = read_toml_at("s2and_rust/pyproject.toml")
          cur_rust_cargo = read_toml_at("s2and_rust/Cargo.toml")

          cur_py_ver = get_project_version(cur_py, "pyproject.toml")
          cur_rust_py_ver = get_project_version(cur_rust_py, "s2and_rust/pyproject.toml")
          cur_rust_cargo_ver = get_cargo_version(cur_rust_cargo, "s2and_rust/Cargo.toml")

          if cur_rust_py_ver != cur_rust_cargo_ver:
            raise SystemExit(
              f"Rust version mismatch: pyproject={cur_rust_py_ver} cargo={cur_rust_cargo_ver}"
            )

          before_py_ver = (
            get_project_version(read_toml_at("pyproject.toml", before), "pyproject.toml", before)
            if before
            else None
          )
          before_rust_py_ver = (
            get_project_version(read_toml_at("s2and_rust/pyproject.toml", before), "s2and_rust/pyproject.toml")
            if before
            else None
          )

          s2and_changed = before_py_ver != cur_py_ver
          rust_changed = before_rust_py_ver != cur_rust_py_ver
          publish_any = s2and_changed or rust_changed or publish_s2and or publish_rust

          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a", encoding="utf-8") as f:
            f.write(f"s2and_changed={'true' if s2and_changed else 'false'}\n")
            f.write(f"rust_changed={'true' if rust_changed else 'false'}\n")
            f.write(f"publish_any={'true' if publish_any else 'false'}\n")
            f.write(f"publish_s2and={'true' if publish_s2and else 'false'}\n")
            f.write(f"publish_rust={'true' if publish_rust else 'false'}\n")
            f.write(f"force_build={'true' if force_build else 'false'}\n")

          print(f"s2and: {before_py_ver} -> {cur_py_ver} changed={s2and_changed}")
          print(f"rust:  {before_rust_py_ver} -> {cur_rust_py_ver} changed={rust_changed}")
          print(f"force_build: {force_build}")
          print(f"publish_s2and: {publish_s2and}")
          print(f"publish_rust: {publish_rust}")
          PY

  s2and-dist:
    name: s2and sdist+wheel
    runs-on: ubuntu-latest
    needs: [detect-versions]
    if: (github.event_name == 'pull_request' && needs.detect-versions.outputs.force_build == 'true') || (github.event_name != 'pull_request' && (needs.detect-versions.outputs.s2and_changed == 'true' || needs.detect-versions.outputs.force_build == 'true' || needs.detect-versions.outputs.publish_s2and == 'true'))
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Hydrate production model LFS files
        run: git lfs pull --include="s2and/data/production_model_v*.pickle,s2and/data/production_model_v*/**"

      - name: Verify hydrated production model files
        run: |
          uv run --no-project python - <<'PY'
          import json
          from pathlib import Path

          pointer_prefix = b"version https://git-lfs.github.com/spec/v1"
          declaration = json.loads(Path("s2and/data/default_production_model.json").read_text(encoding="utf-8"))
          default_dir = Path("s2and/data") / declaration["bundle_dir"]
          required_paths = [
              Path("s2and/data/production_model_v1.0.pickle"),
              Path("s2and/data/production_model_v1.1.pickle"),
              Path("s2and/data/production_model_v1.2.pickle"),
              Path("s2and/data/default_production_model.json"),
          ]
          required_paths.extend(
              sorted(path for path in default_dir.rglob("*") if path.is_file())
          )

          failures = []
          for path in required_paths:
              if not path.exists():
                  failures.append(f"missing: {path}")
                  continue
              head = path.read_bytes()[: len(pointer_prefix)]
              if head == pointer_prefix:
                  failures.append(f"LFS pointer was not hydrated: {path}")

          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Verified {len(required_paths)} hydrated production model files.")
          PY

      - name: Build s2and distributions
        run: |
          rm -rf build
          uv build --sdist --wheel --out-dir dist --clear

      - name: Verify built distributions contain hydrated models
        run: >-
          uv run --no-project python
          scripts/verification/verify_production_model_distributions.py
          --dist-dir dist --source-root .

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and
          path: dist/*

  wheels-windows:
    name: wheels (windows, py${{ matrix.py }})
    runs-on: windows-latest
    needs: [detect-versions]
    if: (github.event_name == 'pull_request' && needs.detect-versions.outputs.force_build == 'true') || (github.event_name != 'pull_request' && (needs.detect-versions.outputs.rust_changed == 'true' || needs.detect-versions.outputs.s2and_changed == 'true' || needs.detect-versions.outputs.force_build == 'true' || needs.detect-versions.outputs.publish_rust == 'true' || needs.detect-versions.outputs.publish_s2and == 'true'))
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.11.5
          command: build
          args: --release --locked --compatibility pypi --out dist
          working-directory: s2and_rust

      - name: Install and exercise Windows wheel
        shell: pwsh
        run: |
          $smokeVenv = Join-Path $env:RUNNER_TEMP "s2and-rust-wheel-smoke"
          $wheel = (Get-ChildItem s2and_rust/dist/*.whl | Select-Object -First 1).FullName
          uv venv --python "${{ matrix.py }}" $smokeVenv
          $python = Join-Path $smokeVenv "Scripts/python.exe"
          uv pip install --python $python $wheel
          uv run --no-project --python $python python scripts/verification/smoke_installed_rust_api.py

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-windows-py${{ matrix.py }}
          path: s2and_rust/dist/*

  wheels-macos:
    name: wheels (macos universal2, py${{ matrix.py }})
    runs-on: macos-latest
    needs: [detect-versions]
    if: (github.event_name == 'pull_request' && needs.detect-versions.outputs.force_build == 'true') || (github.event_name != 'pull_request' && (needs.detect-versions.outputs.rust_changed == 'true' || needs.detect-versions.outputs.s2and_changed == 'true' || needs.detect-versions.outputs.force_build == 'true' || needs.detect-versions.outputs.publish_rust == 'true' || needs.detect-versions.outputs.publish_s2and == 'true'))
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Rust targets (universal2)
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build wheels (universal2)
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        env:
          ARCHFLAGS: "-arch x86_64 -arch arm64"
        with:
          maturin-version: v1.11.5
          command: build
          args: --release --locked --compatibility pypi --out dist
          working-directory: s2and_rust

      - name: Install and exercise macOS wheel
        shell: bash
        run: |
          smoke_venv="$RUNNER_TEMP/s2and-rust-wheel-smoke"
          wheel="$(find s2and_rust/dist -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python "${{ matrix.py }}" "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" "$wheel"
          uv run --no-project --python "$smoke_venv/bin/python" python \
            scripts/verification/smoke_installed_rust_api.py

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-macos-universal2-py${{ matrix.py }}
          path: s2and_rust/dist/*

  wheels-linux:
    name: wheels (linux ${{ matrix.platform.name }})
    runs-on: ubuntu-latest
    needs: [detect-versions]
    if: (github.event_name == 'pull_request' && needs.detect-versions.outputs.force_build == 'true') || (github.event_name != 'pull_request' && (needs.detect-versions.outputs.rust_changed == 'true' || needs.detect-versions.outputs.s2and_changed == 'true' || needs.detect-versions.outputs.force_build == 'true' || needs.detect-versions.outputs.publish_rust == 'true' || needs.detect-versions.outputs.publish_s2and == 'true'))
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: manylinux2014-x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
          # Optional: enable when you want aarch64 wheels.
          - name: manylinux2014-aarch64
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
          - name: musllinux-x86_64
            target: x86_64-unknown-linux-musl
            manylinux: "musllinux_1_2"

    steps:
      - uses: actions/checkout@v5

      - name: Build wheels (manylinux/musllinux)
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.11.5
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: >
            --release --locked --compatibility pypi --out dist
            -i python3.11 -i python3.12 -i python3.13
          working-directory: s2and_rust

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-linux-${{ matrix.platform.name }}
          path: s2and_rust/dist/*

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: [detect-versions]
    if: (github.event_name == 'pull_request' && needs.detect-versions.outputs.force_build == 'true') || (github.event_name != 'pull_request' && (needs.detect-versions.outputs.rust_changed == 'true' || needs.detect-versions.outputs.s2and_changed == 'true' || needs.detect-versions.outputs.force_build == 'true' || needs.detect-versions.outputs.publish_rust == 'true' || needs.detect-versions.outputs.publish_s2and == 'true'))
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.11.5
          command: sdist
          args: --out dist
          working-directory: s2and_rust

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-sdist
          path: s2and_rust/dist/*

  release-smoke:
    name: clean installed-artifact smoke
    if: (github.event_name == 'pull_request' && needs.detect-versions.outputs.force_build == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-versions.outputs.s2and_changed == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (needs.detect-versions.outputs.force_build == 'true' || needs.detect-versions.outputs.publish_s2and == 'true'))
    needs: [detect-versions, s2and-dist, wheels-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Download s2and dists
        uses: actions/download-artifact@v7
        with:
          name: dist-s2and
          path: dist/s2and

      - name: Download CPython 3.11 Rust wheels
        uses: actions/download-artifact@v7
        with:
          name: dist-s2and-rust-linux-manylinux2014-x86_64
          path: dist/s2and-rust

      - name: Clean-install release artifacts
        run: |
          SMOKE_VENV="$RUNNER_TEMP/s2and-release-smoke"
          RUST_WHEEL="$(find dist/s2and-rust -type f -name '*cp311*manylinux*x86_64.whl' -print -quit)"
          PY_WHEEL="$(find dist/s2and -type f -name 's2and-*.whl' -print -quit)"
          test -n "$RUST_WHEEL"
          test -n "$PY_WHEEL"
          uv venv --python 3.11 "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" "$RUST_WHEEL" "$PY_WHEEL"

      - name: Exercise installed public incremental Arrow path
        run: |
          SMOKE_VENV="$RUNNER_TEMP/s2and-release-smoke"
          cd "$RUNNER_TEMP"
          uv run --no-project --python "$SMOKE_VENV/bin/python" python \
            "$GITHUB_WORKSPACE/scripts/verification/smoke_installed_incremental_arrow.py"

      - name: Exercise declared default bundle
        env:
          ALLOW_LEGACY_DEFAULT_REJECTION: ${{ github.event_name == 'pull_request' && needs.detect-versions.outputs.force_build == 'true' }}
        run: |
          SMOKE_VENV="$RUNNER_TEMP/s2and-release-smoke"
          cd "$RUNNER_TEMP"
          uv run --no-project --python "$SMOKE_VENV/bin/python" python - <<'PY'
          import os

          import numpy as np

          from s2and.production_model import DEFAULT_PRODUCTION_MODEL_DIR, load_production_model

          try:
              clusterer = load_production_model()
          except ValueError as exc:
              expected_legacy_rejection = (
                  f"Production bundle {DEFAULT_PRODUCTION_MODEL_DIR.resolve()} was built with "
                  "normalization_version 'legacy_compat' but this package implements 'canonical_v2'. "
                  "Code, model, and artifacts move as one release unit; redeploy the matching package "
                  "or rebuild the bundle (docs/normalization_migration_blocked.md)."
              )
              if (
                  os.environ["ALLOW_LEGACY_DEFAULT_REJECTION"].lower() == "true"
                  and str(exc) == expected_legacy_rejection
              ):
                  print("Validated installed legacy-default rejection for canonical-v2 PR")
                  raise SystemExit(0) from None
              raise
          width = clusterer.classifier.n_features_in_
          probabilities = clusterer.classifier.predict_proba(np.zeros((2, width), dtype=np.float64))
          if probabilities.shape != (2, 2) or not np.isfinite(probabilities).all():
              raise SystemExit(f"invalid pairwise smoke output: shape={probabilities.shape}")
          if clusterer.incremental_linker_artifact_dir is None:
              raise SystemExit("declared default bundle has no incremental linker")
          print(f"Validated installed default bundle v{clusterer.production_model_bundle_version}")
          PY

  release-tests:
    name: release tests (exact commit)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-versions.outputs.s2and_changed == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.detect-versions.outputs.publish_s2and == 'true')
    needs: [detect-versions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install exact source environment
        run: uv sync --extra dev

      - name: Run release test suite
        run: uv run pytest -q

  # Rust publishes first. Python publication remains unreachable until the exact
  # dependency is installable from the target index.
  publish-s2and:
    name: publish s2and to PyPI
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-versions.outputs.s2and_changed == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.detect-versions.outputs.publish_s2and == 'true')
    needs: [detect-versions, s2and-dist, release-smoke, release-tests, probe-rust-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download s2and dists
        uses: actions/download-artifact@v7
        with:
          name: dist-s2and
          path: dist/s2and

      - name: Publish s2and
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/s2and

  publish-rust:
    name: publish s2and-rust to PyPI
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-versions.outputs.rust_changed == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.detect-versions.outputs.publish_rust == 'true')
    needs: [detect-versions, wheels-windows, wheels-macos, wheels-linux, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download s2and-rust dists
        uses: actions/download-artifact@v7
        with:
          pattern: dist-s2and-rust-*
          merge-multiple: true
          path: dist/s2and-rust

      - name: Publish s2and-rust
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/s2and-rust

  probe-rust-release:
    name: probe exact s2and-rust release
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-versions.outputs.s2and_changed == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.detect-versions.outputs.publish_s2and == 'true')) && (needs.publish-rust.result == 'success' || needs.publish-rust.result == 'skipped')
    needs: [detect-versions, publish-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Wait for exact Rust dependency
        run: |
          RUST_VERSION="$(uv run --no-project python - <<'PY'
          import tomllib
          from pathlib import Path

          payload = tomllib.loads(Path('s2and_rust/pyproject.toml').read_text(encoding='utf-8'))
          print(payload['project']['version'])
          PY
          )"
          for attempt in $(seq 1 10); do
            echo "Rust install probe attempt $attempt/10 for s2and-rust==$RUST_VERSION"
            if uv run --no-project --isolated --with "s2and-rust==$RUST_VERSION" python -c "import s2and_rust"; then
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then
              sleep 15
            fi
          done
          echo "s2and-rust==$RUST_VERSION was not installable after 10 attempts" >&2
          exit 1
