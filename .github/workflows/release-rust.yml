name: release artifacts (build, test, publish)

on:
  workflow_dispatch:
    inputs:
      evidence_manifest_url:
        description: "Immutable HTTPS URL for the reviewed release evidence manifest"
        required: true
        type: string
      evidence_manifest_sha256:
        description: "Lowercase SHA-256 of that manifest"
        required: true
        type: string

jobs:
  verify-release-input:
    name: verify pinned release input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Version sync check
        run: uv run --no-project python scripts/sync_version.py --check

      - name: Download and verify release evidence manifest
        env:
          EVIDENCE_MANIFEST_URL: ${{ inputs.evidence_manifest_url }}
          EVIDENCE_MANIFEST_SHA256: ${{ inputs.evidence_manifest_sha256 }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          case "$EVIDENCE_MANIFEST_URL" in
            https://*) ;;
            *) echo "evidence_manifest_url must use HTTPS" >&2; exit 1 ;;
          esac
          case "$EVIDENCE_MANIFEST_SHA256" in
            *[!0-9a-f]*|'') echo "evidence_manifest_sha256 must be lowercase hexadecimal" >&2; exit 1 ;;
          esac
          test "${#EVIDENCE_MANIFEST_SHA256}" -eq 64
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output release-evidence-manifest.json "$EVIDENCE_MANIFEST_URL"
          printf '%s  %s\n' "$EVIDENCE_MANIFEST_SHA256" release-evidence-manifest.json |
            sha256sum --check --strict
          uv run --no-project python -m json.tool release-evidence-manifest.json >/dev/null
          uv run --no-project python s2and/release_evidence.py \
            --manifest release-evidence-manifest.json \
            --expected-manifest-sha256 "$EVIDENCE_MANIFEST_SHA256" \
            --output-root release-evidence

      - name: Enforce release evaluation gate
        env:
          EVIDENCE_MANIFEST_SHA256: ${{ inputs.evidence_manifest_sha256 }}
        run: >-
          uv run --frozen python
          scripts/production/model/release_pairwise.py evaluate-release
          --evidence-manifest release-evidence/evidence_manifest.json
          --expected-evidence-manifest-sha256 "$EVIDENCE_MANIFEST_SHA256"
          --output-report release-evidence/evaluation_report.json

      - uses: actions/upload-artifact@v6
        with:
          name: release-evidence
          path: release-evidence

  s2and-dist:
    name: s2and sdist+wheel
    runs-on: ubuntu-latest
    needs: [verify-release-input]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build s2and distributions
        run: |
          rm -rf build
          uv build --sdist --wheel --out-dir dist --clear

      - name: Verify built release asset contract
        run: >-
          uv run --no-project python
          scripts/verification/verify_production_model_distributions.py
          --dist-dir dist --source-root .

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and
          path: dist/*

  wheels-windows:
    name: wheels (windows, py${{ matrix.py }})
    runs-on: windows-latest
    needs: [verify-release-input]
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          command: build
          args: --release --locked --compatibility pypi --out dist
          working-directory: s2and_rust

      - name: Install and exercise Windows wheel
        shell: pwsh
        run: |
          $smokeVenv = Join-Path $env:RUNNER_TEMP "s2and-rust-wheel-smoke"
          $wheel = (Get-ChildItem s2and_rust/dist/*.whl | Select-Object -First 1).FullName
          uv venv --python "${{ matrix.py }}" $smokeVenv
          $python = Join-Path $smokeVenv "Scripts/python.exe"
          uv pip install --python $python $wheel
          uv run --no-project --python $python python scripts/verification/smoke_installed_rust_api.py

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-windows-py${{ matrix.py }}
          path: s2and_rust/dist/*

  wheels-macos:
    name: wheels (macos universal2, py${{ matrix.py }})
    runs-on: macos-latest
    needs: [verify-release-input]
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Rust targets (universal2)
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build wheels (universal2)
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        env:
          ARCHFLAGS: "-arch x86_64 -arch arm64"
        with:
          maturin-version: v1.14.1
          command: build
          args: --release --locked --compatibility pypi --out dist
          working-directory: s2and_rust

      - name: Install and exercise macOS wheel
        shell: bash
        run: |
          smoke_venv="$RUNNER_TEMP/s2and-rust-wheel-smoke"
          wheel="$(find s2and_rust/dist -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python "${{ matrix.py }}" "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" "$wheel"
          uv run --no-project --python "$smoke_venv/bin/python" python \
            scripts/verification/smoke_installed_rust_api.py

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-macos-universal2-py${{ matrix.py }}
          path: s2and_rust/dist/*

  wheels-linux:
    name: wheels (linux ${{ matrix.platform.name }})
    runs-on: ubuntu-latest
    needs: [verify-release-input]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: manylinux2014-x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
          - name: manylinux2014-aarch64
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
          - name: musllinux-x86_64
            target: x86_64-unknown-linux-musl
            manylinux: "musllinux_1_2"

    steps:
      - uses: actions/checkout@v5

      - name: Build wheels (manylinux/musllinux)
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: >
            --release --locked --compatibility pypi --out dist
            -i python3.11 -i python3.12 -i python3.13
          working-directory: s2and_rust

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-linux-${{ matrix.platform.name }}
          path: s2and_rust/dist/*

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: [verify-release-input]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist
          working-directory: s2and_rust

      - name: Install and exercise sdist
        shell: bash
        run: |
          smoke_venv="$RUNNER_TEMP/s2and-rust-sdist-smoke"
          sdist="$(find s2and_rust/dist -type f -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          uv venv --python 3.11 "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" "$sdist"
          uv run --no-project --python "$smoke_venv/bin/python" python \
            scripts/verification/smoke_installed_rust_api.py

      - uses: actions/upload-artifact@v6
        with:
          name: dist-s2and-rust-sdist
          path: s2and_rust/dist/*

  release-bundle:
    name: freeze release bytes
    needs: [s2and-dist, wheels-windows, wheels-macos, wheels-linux, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download s2and distributions
        uses: actions/download-artifact@v7
        with:
          name: dist-s2and
          path: release/s2and

      - name: Download s2and-rust distributions
        uses: actions/download-artifact@v7
        with:
          pattern: dist-s2and-rust-*
          merge-multiple: true
          path: release/s2and-rust

      - name: Generate and verify SHA256SUMS
        run: |
          cd release
          find s2and s2and-rust -type f -print0 |
            LC_ALL=C sort -z |
            xargs -0 sha256sum > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - uses: actions/upload-artifact@v6
        with:
          name: release-distributions
          path: release

  release-smoke:
    name: clean installed-artifact smoke
    needs: [release-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Download frozen release bytes
        uses: actions/download-artifact@v7
        with:
          name: release-distributions
          path: release

      - name: Clean-install release artifacts
        run: |
          cd release
          sha256sum --check --strict SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          SMOKE_VENV="$RUNNER_TEMP/s2and-release-smoke"
          RUST_WHEEL="$(find release/s2and-rust -type f -name '*cp311*manylinux*x86_64.whl' -print -quit)"
          PY_WHEEL="$(find release/s2and -type f -name 's2and-*.whl' -print -quit)"
          test -n "$RUST_WHEEL"
          test -n "$PY_WHEEL"
          uv venv --python 3.11 "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" "$RUST_WHEEL" "$PY_WHEEL"

      - name: Exercise installed synthetic incremental Arrow path
        run: |
          SMOKE_VENV="$RUNNER_TEMP/s2and-release-smoke"
          cd "$RUNNER_TEMP"
          uv run --no-project --python "$SMOKE_VENV/bin/python" python \
            "$GITHUB_WORKSPACE/scripts/verification/smoke_installed_incremental_arrow.py"

  release-tests:
    name: release tests (exact commit)
    needs: [verify-release-input]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install exact source environment
        run: uv sync --extra dev

      - name: Run release test suite
        run: uv run pytest -q

  # Rust publishes first. Python publication remains unreachable until the exact
  # dependency is installable from the target index.
  publish-s2and:
    name: publish s2and to PyPI
    needs: [release-bundle, release-smoke, release-tests, probe-rust-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download frozen release bytes
        uses: actions/download-artifact@v7
        with:
          name: release-distributions
          path: release

      - name: Verify frozen release bytes
        run: cd release && sha256sum --check --strict SHA256SUMS

      - name: Publish s2and
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/s2and

  publish-rust:
    name: publish s2and-rust to PyPI
    needs: [release-bundle, release-smoke, release-tests]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download frozen release bytes
        uses: actions/download-artifact@v7
        with:
          name: release-distributions
          path: release

      - name: Verify frozen release bytes
        run: cd release && sha256sum --check --strict SHA256SUMS

      - name: Publish s2and-rust
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/s2and-rust

  probe-rust-release:
    name: probe exact s2and-rust release
    needs: [publish-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Wait for exact Rust dependency
        run: |
          RUST_VERSION="$(uv run --no-project python - <<'PY'
          import tomllib
          from pathlib import Path

          payload = tomllib.loads(Path('s2and_rust/pyproject.toml').read_text(encoding='utf-8'))
          print(payload['project']['version'])
          PY
          )"
          for attempt in $(seq 1 10); do
            echo "Rust install probe attempt $attempt/10 for s2and-rust==$RUST_VERSION"
            if uv run --no-project --isolated --with "s2and-rust==$RUST_VERSION" python -c "import s2and_rust"; then
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then
              sleep 15
            fi
          done
          echo "s2and-rust==$RUST_VERSION was not installable after 10 attempts" >&2
          exit 1

  probe-s2and-release:
    name: probe exact s2and release
    needs: [publish-s2and]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Wait for exact s2and release
        run: |
          S2AND_VERSION="$(tr -d '[:space:]' < VERSION)"
          for attempt in $(seq 1 10); do
            echo "s2and install probe attempt $attempt/10 for s2and==$S2AND_VERSION"
            if uv run --no-project --isolated --with "s2and==$S2AND_VERSION" python -c "import s2and"; then
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then
              sleep 15
            fi
          done
          echo "s2and==$S2AND_VERSION was not installable after 10 attempts" >&2
          exit 1
